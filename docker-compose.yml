version: '3.8'

services:
  ai-doc-assistant:
    build: .
    container_name: ai_document_assistant
    ports:
      - "8000:8000"
    # Persist the actual SQLite database file across container restarts
    volumes:
      - ./app/assistant.db:/app/app/assistant.db
    # Read environment secrets from local .env
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
